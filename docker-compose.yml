version: "2.2"

services:
  backend:
    build:
      context: ./melo-cma-nwp
    restart: unless-stopped
    privileged: true
    security_opt:
      - seccomp:unconfined
    environment:
      CMA_GFS_ROOT: /data/CMA-GFS-DATA
      CMA_MESO_ROOT: /data/CMA-MESO-DATA
    volumes:
      - ./CMA-GFS-DATA:/data/CMA-GFS-DATA
      - ./CMA-MESO-DATA:/data/CMA-MESO-DATA
      - ./melo-cma-nwp/src/main/resources:/app/config

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./frontend/public/config:/usr/share/nginx/html/config
